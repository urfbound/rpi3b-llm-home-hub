name: Publish release bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          mkdir "homehub-${RELEASE_TAG}"
          git archive --format=tar "${GITHUB_SHA}" | tar -xf - -C "homehub-${RELEASE_TAG}"
          tar -czf "homehub-${RELEASE_TAG}.tar.gz" "homehub-${RELEASE_TAG}"
          sha256sum "homehub-${RELEASE_TAG}.tar.gz" > "homehub-${RELEASE_TAG}.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "homehub-${RELEASE_TAG}.tar.gz" \
            "homehub-${RELEASE_TAG}.tar.gz.sha256" \
            --title "$RELEASE_TAG" \
            --generate-notes
