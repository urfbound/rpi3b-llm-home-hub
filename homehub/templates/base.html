<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Hub</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script>document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';function toggleTheme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t)}</script></head><body><header><a class="brand" href="/">⌂ Home Hub</a><div class="toolbar"><button type="button" onclick="toggleTheme()">☀ / ☾</button>{% if current_user %}<span>{{ current_user['username'] }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button>Log out</button></form>{% endif %}</div></header><main>{% for msg in get_flashed_messages() %}<p class="notice">{{msg}}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>Home Hub · Local-first and made for home.</footer></body></html>
