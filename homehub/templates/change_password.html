{% extends 'base.html' %}
{% block content %}
<section class="panel auth">
  <p class="eyebrow">Account access</p>
  <h1>Choose a new password</h1>
  {% if current_user['must_change_password'] %}<p>Your temporary password must be changed before you continue.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
    <button class="primary">Change password</button>
  </form>
</section>
{% endblock %}
